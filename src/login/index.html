<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kryton — Add Server</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <main class="shell-page">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="7" cy="8" r="2" fill="currentColor"/>
            <circle cx="17" cy="8" r="2" fill="currentColor"/>
            <circle cx="12" cy="17" r="2" fill="currentColor"/>
            <path d="M7 8 L17 8 M7 8 L12 17 M17 8 L12 17" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
          </svg>
        </span>
        <span class="brand-name">kryton</span>
      </div>

      <section class="card">
        <p class="eyebrow">// add server</p>
        <h1 class="title">Connect a Kryton</h1>

        <form id="login-form" novalidate>
          <div class="field">
            <span class="field-label">label</span>
            <input class="input" name="label" required placeholder="Home" autocomplete="off" />
          </div>
          <div class="field">
            <span class="field-label">server url</span>
            <input class="input" name="serverUrl" type="url" required placeholder="https://kryton.example.com" autocomplete="off" />
          </div>
          <div class="field">
            <span class="field-label">email</span>
            <input class="input" name="username" type="email" required placeholder="you@example.com" autocomplete="username" />
          </div>
          <div class="field">
            <span class="field-label">password</span>
            <input class="input" name="password" type="password" required placeholder="••••••••••" autocomplete="current-password" />
          </div>

          <button class="btn btn-primary" type="submit" id="submit-btn">
            <span id="submit-label">Add server</span>
          </button>
          <p class="error" id="error" hidden></p>
        </form>
      </section>

      <p class="footnote">self-hosted · your notes, your server</p>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
