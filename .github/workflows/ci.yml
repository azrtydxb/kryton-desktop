name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Nightly tier runs the same linux unit; the windows/macos matrix is
  # release-only (v* tag or manual dispatch) so PRs stay under 5 minutes.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux unit stays on every PR/push (and is the required
        # "build (ubuntu-latest)" check); the full OS matrix is release-only.
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["macos-latest","windows-latest","ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 9 }

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0", components: "rustfmt,clippy" }

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
